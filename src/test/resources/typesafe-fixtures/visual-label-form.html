<!DOCTYPE html>
<html><head><title>Visual labels</title></head>
<body>
  <!-- Labels sit next to their inputs but aren't tied to them (no for=, not wrapping), and the
       inputs have meaningless generated names - the rpachallenge.com pattern. -->
  <form>
    <div><label>First Name</label><input name="x7Kq2"></div>
    <div><label>Email</label><input name="p0Zr9"></div>
    <input type="submit" value="Submit" onclick="event.preventDefault(); document.title='submitted'">
  </form>
</body></html>
